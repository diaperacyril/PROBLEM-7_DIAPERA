<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenThumb</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVIGATION (ENHANCED DESIGN ONLY) -->
<nav class="navbar">
    <div class="logo">🌱 GreenThumb</div>
    <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#app">Tracker</a>
    </div>
</nav>

<!-- HOME -->
<section id="home" class="home">
    <h1>Welcome to GreenThumb 🌿</h1>
    <p>Track your plants and never forget watering again.</p>
    <a href="#app" class="start-btn">Start Tracking</a>
</section>

<!-- APP -->
<section id="app">

    <div class="container">

        <h1>🌱 GreenThumb Tracker 🌱</h1>

        <div class="form">
            <input type="text" id="plantName" placeholder="Plant name">
            <input type="number" id="frequency" placeholder="Water every (days)">
            <button onclick="addPlant()">Add Plant</button>
        </div>

        <button id="historyBtn" onclick="toggleHistory()">
            📜 View Watering History
        </button>

        <div id="historySection" style="display:none;">
            <h2>🌱 Watering History</h2>
            <ul id="historyList"></ul>
        </div>

        <h2>My Plants</h2>
        <ul id="plantList"></ul>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
